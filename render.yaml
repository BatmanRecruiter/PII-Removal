services:
  - type: web
    name: pii-redactor
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python -m spacy download en_core_web_md"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # OCR on, in low-memory mode: the spaCy model is evicted before the OCR
      # phase and reloaded for analysis, so the two never stack (~472 MB peak
      # measured vs the 512 MB limit). Costs a model reload per OCR'd file.
      - key: OCR_ENABLED
        value: "1"
      - key: OCR_LOW_MEMORY
        value: "1"
      # 150 dpi: reads resume-sized text reliably, smaller OCR buffers.
      - key: OCR_DPI
        value: "150"
      # In-process worker: the separate-process worker duplicates ~100 MB of
      # interpreter+libraries, which pushed this 512 MB instance into
      # memory-thrash (first live job sat "processing" for 15+ minutes).
      - key: JOB_WORKER
        value: "thread"
      # Fewer glibc malloc arenas: measurably lower RSS on small instances.
      - key: MALLOC_ARENA_MAX
        value: "2"
